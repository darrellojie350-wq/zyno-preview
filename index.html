<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/zyno-preview/">
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="black" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Zyno — Private Kimi CLI. Ultra-fast private sessions on your own VPS." />
  <title>Zyno</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      height: 100%;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #splash .rings {
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      animation: breathe 2.2s ease-in-out infinite;
    }
    #splash .rings::before {
      content: ""; position: absolute; inset: 18px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,0.45);
    }
    #splash .brand {
      font-size: 30px; font-weight: 700; letter-spacing: -0.5px;
    }
    #splash .tag {
      margin-top: 8px; font-size: 12px; color: #6B6B6B; letter-spacing: 1.4px;
    }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.03); opacity: 1; } }
    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="rings">
      <div>
        <div class="brand" style="text-align:center">Zyno</div>
        <div class="tag" style="text-align:center">PRIVATE KIMI CLI</div>
      </div>
    </div>
  </div>
  <script>
    // Remove boot splash once flutter renders its first frame.
    function removeSplash() {
      var s = document.getElementById('splash');
      if (s) {
        s.classList.add('hidden');
        setTimeout(function () { s.remove(); }, 450);
      }
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    // Fallback: remove after 6s regardless.
    setTimeout(removeSplash, 6000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
